name: Release

# Appelé par CI après un build réussi sur main. semantic-release (.releaserc.json) lit les Conventional Commits
# depuis le dernier tag : breaking change → majeure, feat → mineure, fix/perf → patch, sinon pas de release.
# S'il y a une release : bump (VERSION, constante, CHANGELOG), build et smoke test de l'archive, commit
# « chore(release): X.Y.Z » poussé sur main, tag vX.Y.Z, release GitHub avec le zip et son .sha256.
on:
  workflow_call:
  workflow_dispatch:   # relancer une release à la main (même calcul)

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    concurrency:   # une release à la fois, jamais annulée en cours de route
      group: release
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique et tags pour le calcul de version ; numéro de build = nombre de commits

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Swift toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          swift --version

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          -p @semantic-release/github@12.0.10
          -p conventional-changelog-conventionalcommits@10.4.1
          semantic-release

      - name: Keep the archive with the run
        if: hashFiles('Cairn/build/Cairn-*.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Cairn-release
          path: |
            Cairn/build/Cairn-*.zip
            Cairn/build/Cairn-*.zip.sha256
