name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and self-tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # numéro de build = nombre de commits

      - name: Swift toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Cairn/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Cairn/Package.swift', 'Cairn/Package.resolved') }}

      - name: Build
        run: swift build --package-path Cairn

      - name: Self-tests
        run: Cairn/.build/debug/cairn-selftest

      - name: App bundle
        run: Cairn/build-app.sh --no-install
